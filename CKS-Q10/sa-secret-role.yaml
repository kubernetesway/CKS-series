apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-three-reader
  namespace: cks-limited
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["secret-three"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-three-reader-binding
  namespace: cks-restrictive
subjects:
- kind: ServiceAccount
  name: secret-reader
  namespace: cks-limited
roleRef:
  kind: Role
  name: secret-three-reader
  apiGroup: rbac.authorization.k8s.io