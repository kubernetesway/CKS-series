apiVersion: v1
kind: Pod
metadata:
  name: pod-one
  namespace: cks-restrictive
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 36000"]
    volumeMounts:
    - name: secret-volume
      mountPath: /etc/secret
      readOnly: true
  volumes:
  - name: secret-volume
    secret:
      secretName: secret-one

---
apiVersion: v1
kind: Pod
metadata:
  name: pod-two
  namespace: cks-restrictive
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 36000"]
    envFrom:
    - secretRef:
        name: secret-two

---
apiVersion: v1
kind: Pod
metadata:
  name: pod-three
  namespace: cks-restrictive
spec:
  serviceAccountName: secret-reader
  automountServiceAccountToken: true
  containers:
  - name: app
    image: curlimages/curl:latest
    command: ["sh", "-c", "sleep 36000"]