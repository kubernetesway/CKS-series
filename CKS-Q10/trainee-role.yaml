apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trainee-pod-access
  namespace: cks-limited
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trainee-pod-binding
  namespace: cks-limited
subjects:
- kind: User
  name: cks-trainee
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: trainee-pod-access
  apiGroup: rbac.authorization.k8s.io